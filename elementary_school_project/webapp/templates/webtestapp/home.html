<!DOCTYPE html>
{% load static %}
{% load widget_tweaks %}
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>ホーム画面</title>
    <link rel="stylesheet" href="{% static 'css/reset.css' %}">
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&family=Noto+Serif+JP:wght@200&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>{{ title }}</h1>
        <ul class="header-ul">
            <li><a href="#">アプリの使い方</a></li>
            <li><a href="{{ upstream_url }}">上流</a><img src="{% static 'media/finger.png' %}" alt="指" class="finger" id="finger-1"></li>
            <li><a href="{{ midstream_url }}">中流</a><img src="{% static 'media/finger.png' %}" alt="指" class="finger" id="finger-2"></li>
            <li><a href="{{ downstream_url }}">下流</a><img src="{% static 'media/finger.png' %}" alt="指" class="finger" id="finger-3"></li>
            <li><a href="{% url 'webtestapp:index' %}">カードを作る</a><img src="{% static 'media/finger.png' %}" alt="指" class="finger" id="finger-4"></li>
            <li><a href="{% url 'webtestapp:aquatic_life' %}">水生生物図鑑</a><img src="{% static 'media/finger.png' %}" alt="指" class="finger" id="finger-5"></li>
        </ul>
    </header>

    <div class="character-container" id="character-container">
        <img src="{% static 'media/mushitori_boy.png' %}" alt="キャラクター" class="character">
        <div class="speech-bubble" id="speech-bubble">
            <span id="speech-text"></span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const characterContainer = document.getElementById('character-container');
            const speechBubble = document.getElementById('speech-bubble');
            const speechText = document.getElementById('speech-text');
            const text = 'こんにちは！まずは、「カードを作る」ページに進んでみよう！';

            // キャラクターと吹き出しを表示
            setTimeout(function() {
                characterContainer.classList.add('visible');
                speechBubble.classList.add('visible');

                // 一文字ずつテキストを表示
                let index = 0;
                const typingInterval = setInterval(function() {
                    if (index < text.length) {
                        speechText.innerHTML += text[index++];
                    } else {
                        clearInterval(typingInterval);

                        // キャラクターと吹き出しを消す
                        setTimeout(function() {
                            characterContainer.classList.remove('visible');
                            speechBubble.classList.remove('visible');

                            // 指を表示
                            setTimeout(function() {
                                document.getElementById('finger-4').style.display = 'block';
                            }, 1000);
                        }, 2000); // テキストが表示されてから2秒後に消す
                    }
                }, 100); // 100ミリ秒ごとに文字を追加
            }, 1000); // 1秒後にアニメーション開始
        });
    </script>
</body>
</html>
