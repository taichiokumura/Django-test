<!DOCTYPE html>
{% load static %}
{% load widget_tweaks %}
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>テストWebアプリ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/reset.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&family=Noto+Serif+JP:wght@200&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>{{ title }}</h1>
    </header>

    <div id="uploadForm"> 
        {% if login_success or login_failure %}
        <div id="overlay"></div>
        {% endif %}
        <form action="{% url 'webtestapp:index' %}" method="post" enctype="multipart/form-data" id="imageUploadForm">
            <div id="imageUpload-wrap">
                {% csrf_token %}
                <div>
                    <label class="file_label">
                        写真を撮る
                        {{ upload_form.photo }} {# フォーム部品を表示 #}
                    </label>
                </div>

                <div class="right-wrap">   
                    <label class="button_label">
                        とうこう
                        <input type="button" value="アップロード" id="myBtn">
                    </label>
                </div>
            </div>

            <!-- カード -->
            <div class="card">
                <!-- 写真表示 -->
                <div class="card-preview">
                    <div id="preview">
                        <p>写真</p>
                    </div>
                </div>

            </div>
        </form>
    </div>

    <!-- モーダルウィンドウ -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <div class="modal-close js-modal-close">&times;</div>
            <h2>確認画面</h2>
            <p>この画像で良いですか</p>
            <div id="modalContent"></div>

            <!-- イラスト選択UI -->
            <div>
                <div>
                    <label>イラストを再選択</label>
                    <div class="illustration-options">
                        <label>
                            <input type="radio" name="illustration" value="media/kawasemi1.png">
                            <img src="{% static 'media/kawasemi1.png' %}" alt="イラスト1" class="illustration-thumb">
                        </label>
                        <label>
                            <input type="radio" name="illustration" value="media/kawasemi2.png">
                            <img src="{% static 'media/kawasemi2.png' %}" alt="イラスト2" class="illustration-thumb">
                        </label>
                        <label>
                            <input type="radio" name="illustration" value="media/kawasemi3.png">
                            <img src="{% static 'media/kawasemi3.png' %}" alt="イラスト3" class="illustration-thumb">
                        </label>
                    </div>
                </div>
            </div>
            
            <div id="imagePreview"></div>
            <button onclick="submitForm()" id="upload_btn">アップロード</button>
        </div>
    </div>

    <!-- ログインメッセージの表示 -->
    {% if work_sheet_success %}
    <div id="login_judge_modal">
        <div class="modal_container">
            <p>{{ work_sheet_success }}</p>
            <ul>
                <li><a href="{% url 'webtestapp:river' %}">次へ</a></li>
            </ul>
        </div>
    </div>
    {% elif work_sheet_failure %}
    <div id="login_failure_modal">
        <div class="modal_container">
            <p>{{ work_sheet_failure }}</p>
            <ul>
                <li><a href="{% url 'webtestapp:index' %}">戻る</a></li>
            </ul>
        </div>
    </div>
    {% endif %}

    <script type="text/javascript" src="{% static 'js/modal.js' %}"></script>
    <script>
        function submitForm() {
            const form = document.getElementById('imageUploadForm');
            const selectedIllustration = document.querySelector('input[name="illustration"]:checked');
            
            if (selectedIllustration) {
                const illustrationField = document.createElement('input');
                illustrationField.type = 'hidden';
                illustrationField.name = 'illustration';
                illustrationField.value = selectedIllustration.value;
                form.appendChild(illustrationField);
            }
            
            form.submit();  // フォームを送信
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            if ("{{ show_tutorial }}") {
                const characterContainer = document.getElementById('character-container');
                const speechBubble = document.getElementById('speech-bubble');
                const speechText = document.getElementById('speech-text');
                const text = 'カード作成を始めましょう！';

                // キャラクターと吹き出しを表示
                setTimeout(function() {
                    characterContainer.classList.add('visible');
                    speechBubble.classList.add('visible');

                    // 一文字ずつテキストを表示
                    let index = 0;
                    const typingInterval = setInterval(function() {
                        if (index < text.length) {
                            speechText.innerHTML += text[index++];
                        } else {
                            clearInterval(typingInterval);

                            // キャラクターと吹き出しを消す
                            setTimeout(function() {
                                characterContainer.classList.remove('visible');
                                speechBubble.classList.remove('visible');
                            }, 2000); // テキストが表示されてから2秒後に消す
                        }
                    }, 100); // 100ミリ秒ごとに文字を追加
                }, 1000); // 1秒後にアニメーション開始
            }
        });
    </script>
</body>
</html>
